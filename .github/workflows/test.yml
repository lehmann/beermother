name: Unit Tests

on:
  push:
    branches-ignore:
      - main
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run Node tests
        run: node --experimental-loader ./docs/js/tests/loader.js --test docs/js/tests/*.test.js

      - name: Run local-engine tests
        run: node --test docs/js/analysis/local-engine.test.mjs
